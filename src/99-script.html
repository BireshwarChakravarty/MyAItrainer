
<script>

const el=(tag,attrs={},html)=>{const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;};

/* ---------------- toast & copy ---------------- */
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2200);}
function copyText(text,btn){
  const done=()=>{toast("Copied to clipboard");if(btn){const o=btn.textContent;btn.textContent="Copied";btn.classList.add("ok");setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok");},1600);}};
  const fallback=()=>{const ta=el("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();ok?done():toast("Select the text and copy it manually");};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}

$("#themeBtn").addEventListener("click",()=>{

/* ---------------- prompt blocks ---------------- */
function wrapPrompts(scope=document){
  $$("pre.pr",scope).forEach(p=>{
    const w=el("div",{class:"prompt"});
    const head=el("div",{class:"ph"});head.appendChild(el("span",{text:p.dataset.label||"Prompt"}));
    const b=el("button",{class:"copy",type:"button",text:"Copy"});head.appendChild(b);
    const pre=el("pre");pre.textContent=p.textContent;
    w.appendChild(head);w.appendChild(pre);p.replaceWith(w);
    b.addEventListener("click",()=>copyText(pre.textContent,b));
  });
}

/* ---------------- quizzes ---------------- */
function initQuizzes(){
  $$(".quiz").forEach(qz=>{
    const qid=qz.dataset.quiz;S.quiz[qid]=S.quiz[qid]||{};
    $$(".q",qz).forEach((q,qi)=>{
      const qt=$(".qt",q);qt.insertAdjacentHTML("afterbegin",`<span class="qn">${qi+1}.</span>`);
      const a=+q.dataset.a, opts=$$(".opt",q), why=$(".why",q);
      const show=(chosen)=>{opts.forEach((o,i)=>{o.disabled=true;if(i===a)o.classList.add("correct");if(i===chosen&&i!==a)o.classList.add("incorrect");});
        why.hidden=false;why.innerHTML=(chosen===a?"<b>Correct.</b> ":"<b>Not quite.</b> ")+why.dataset.base;};
      why.dataset.base=why.innerHTML;
      opts.forEach((o,i)=>{o.type="button";o.addEventListener("click",()=>{show(i);S.quiz[qid][qi]=i;save();});});
      if(S.quiz[qid][qi]!=null)show(S.quiz[qid][qi]);
    });
    const reset=el("button",{class:"btn ghost",type:"button",text:"Reset quiz"});reset.style.marginTop="6px";
    reset.addEventListener("click",()=>{S.quiz[qid]={};save();$$(".q",qz).forEach(q=>{$$(".opt",q).forEach(o=>{o.disabled=false;o.classList.remove("correct","incorrect");});const w=$(".why",q);w.hidden=true;});});
    qz.appendChild(reset);
  });
}

/* ---------------- generic choice-card game ---------------- */
function cardGame(container,scoreEl,items,choices){
  let answered=0,right=0;
  items.forEach(it=>{
    const c=el("div",{class:"gcard"});c.appendChild(el("p",{},it.q));
    const row=el("div",{class:choices.tl?"tl":"chips"});
    choices.list.forEach(ch=>{
      const b=el("button",{type:"button",class:choices.tl?ch.k:"chip","aria-pressed":"false"},choices.tl?`<i></i>${esc(ch.label)}`:esc(ch.label));
      b.addEventListener("click",()=>{
        if(c.dataset.done)return;c.dataset.done="1";answered++;
        b.setAttribute("aria-pressed","true");
        const ok=ch.k===it.a;if(ok)right++;
        c.classList.add(ok?"right":"wrong");
        const correct=choices.list.find(x=>x.k===it.a).label;
        c.appendChild(el("p",{class:"why"},(ok?"<b>Right.</b> ":`<b>Answer: ${esc(correct)}.</b> `)+it.why));
        scoreEl.textContent=`${right} of ${answered} right so far, ${items.length} in total`+(answered===items.length&&right<items.length?". Read the explanations for the ones you missed.":"");
      });
      row.appendChild(b);
    });
    c.appendChild(row);container.appendChild(c);
  });
}

/* ---------------- LAB 1.1 next word ---------------- */
(function(){
  const base="The cycle count at Warehouse 3 found that SKU 4471 was";
  const S1=[["short",.40],["over",.18],["missing",.16],["miscounted",.12],["damaged",.08],["purple",.006]];
  const S2=[["by",.46],["again",.2],["after",.14],["because",.12],["yesterday",.06],["delicious",.004]];
  const S3={by:[["12 units.",.38],["a full case.",.24],["3%.",.18],["$480.",.12],["a banana.",.004]],
    again:[["this month.",.42],["after recount.",.3],["at receiving.",.15],["on Tuesday.",.1],["in Narnia.",.003]],
    after:[["the recount.",.4],["receiving.",.28],["a transfer.",.2],["lunch.",.08],["the moon landing.",.003]],
    because:[["of a UOM error.",.34],["of a timing gap.",.28],["of mis-slotting.",.22],["of damage.",.12],["it was Tuesday.",.01]],
    yesterday:[["afternoon.",.5],["morning.",.4],["evening.",.09],["in a dream.",.004]],
    delicious:[["(the sentence has gone off the rails)",1]]};
  const txt=$("#nwText"),cands=$("#nwCands"),temp=$("#nwTemp"),tv=$("#nwTempV"),note=$("#nwNote");
  let picks=[];
  const silly=new Set(["purple","delicious","a banana.","in Narnia.","the moon landing.","it was Tuesday.","in a dream.","(the sentence has gone off the rails)"]);
  const curList=()=>picks.length===0?S1:picks.length===1?S2:picks.length===2?S3[picks[1]]:null;
  const dist=list=>{const T=+temp.value;const w=list.map(([,p])=>Math.pow(p,1/T));const s=w.reduce((a,b)=>a+b,0);return list.map(([t],i)=>[t,w[i]/s]);};
  function render(){
    tv.textContent=(+temp.value).toFixed(1);
    txt.innerHTML=esc(base)+" "+picks.map(p=>`<span class="gen">${esc(p)}</span>`).join(" ")+(picks.length<3?'<span class="cursor"></span>':"");
    cands.innerHTML="";const list=curList();
    if(!list){
      note.hidden=false;const odd=picks.some(p=>silly.has(p));
      note.innerHTML=`<b>Sentence complete.</b> It reads fluently, but the model never checked a single stock record. It only chose words that commonly follow each other. ${odd?"You (or the dice) picked an unlikely word, which is what happens more often at high creativity. ":""}That is why AI can sound right while being wrong, and why factual work needs low creativity and your verification.`;
      $("#nwAuto").disabled=true;return;}
    note.hidden=true;$("#nwAuto").disabled=false;
    dist(list).forEach(([t,p])=>{
      const b=el("button",{class:"nw-c",type:"button"});
      b.innerHTML=`<span>${esc(t)}</span><span class="nw-bar"><span style="width:${(p*100).toFixed(1)}%"></span></span><span class="p">${(p*100).toFixed(1)}%</span>`;
      b.addEventListener("click",()=>{picks.push(t);render();});cands.appendChild(b);
    });
  }
  $("#nwAuto").addEventListener("click",()=>{const list=curList();if(!list)return;const d=dist(list);let r=Math.random(),acc=0;for(const [t,p] of d){acc+=p;if(r<=acc){picks.push(t);break;}}if(picks.length===0||curList()===list)picks.push(d[0][0]);render();});
  $("#nwReset").addEventListener("click",()=>{picks=[];render();});
  temp.addEventListener("input",render);render();
})();

(function(){
  let where=null,what=null;const out=$("#pkOut");
  const W={excel:"Excel / Microsoft 365",google:"Google Sheets",erp:"your ERP / WMS",none:"no data"};
  function rec(){
    if(!where||!what){out.hidden=true;return;}

    switch(what){
      case "learn":r=`<b>Use ${tool} in chat.</b> Ask it to explain like you're new, with a warehouse example, then ask follow-up questions. Pick Ticket prompts (Module 4) help.`;break;
      case "formula":r=where==="excel"?`<b>Use Copilot in Excel</b> (side pane) if licensed: "Add a column that…". Otherwise describe your columns to a chat assistant and ask for the formula. Test it on 3 rows you know the answer to (Module 7).`
        :where==="google"?`<b>Use Gemini in Sheets</b>, or describe your columns to a chat assistant. Mention you're using Google Sheets; some functions differ from Excel.`
        :where==="erp"?`<b>Export the report to Excel first</b>, then ask a chat assistant for the formula using your column names. Formulas need the data in a spreadsheet.`

        :where==="google"?`<b>Use Gemini in Sheets</b>, or upload an anonymised copy to your approved assistant's data analysis. Confirm row counts first.`
        :where==="erp"?`<b>Export to Excel or CSV</b>, then use Copilot in Excel or upload to your approved assistant. Also ask IT whether your ERP has built-in analytics or AI features (Module 2).`
        :`<b>You'll need data first.</b> Export the relevant report, clean it (Module 5), then come back.`;break;
      case "write":r=`<b>Use ${tool}</b>${where==="excel"?", or Copilot in Word/Outlook":""}. Give it your facts in note form and the audience. The finding builder in Module 9 structures this for you. Check every number before sending.`;break;

(function(){
  const P={
    variance:{role:"You are an experienced inventory audit analyst for a distributor with 7 warehouses.",task:"Review the cycle count data below. Find every line outside tolerance, rank by variance value, and suggest the most likely cause and first check for the top 10.",ctx:"Columns: WH, SKU, UOM, Sys_Qty, Cnt_Qty, Unit_Cost. Variance = counted minus system. Tolerance is ±2% per line. Some SKUs are in cases of 12. This is October data.",fmt:"A table: SKU, WH, Variance %, Variance value, Likely cause, First check. Then a 3-bullet summary for my manager.",chk:"Use only the data provided. State how many rows you analysed. If a cause can't be determined from the data, say 'unclear' rather than guessing."},
    email:{role:"You are a procurement professional writing to a colleague.",task:"Draft an email to the WH05 warehouse manager asking them to recount 12 SKUs and check their receiving unit-of-measure settings.",ctx:"WH05's accuracy dropped from 97.8% to 90.9% this month. 22 of 38 exceptions are case-pack SKUs received as eaches. We have a good working relationship.",fmt:"Under 150 words. Subject line, short greeting, the facts, a clear ask with a deadline of Friday.",chk:"Friendly and collaborative. No blame on individuals. Don't invent facts beyond these."},
    formula:{role:"You are an Excel expert who explains things simply.",task:"Write a formula that flags invoice lines where the invoice unit price is more than 2% above the PO unit price.",ctx:"Microsoft 365. Excel Table named Invoices with columns PO_Price and Inv_Price. Some PO_Price cells may be blank.",fmt:"The formula, then one sentence per part explaining what it does.",chk:"Handle blanks without errors. Tell me how to test it on a few rows."},
    contract:{role:"You are a procurement analyst reviewing a supplier agreement.",task:"Summarise the key commercial terms of the attached (anonymised) supply contract.",ctx:"I need to check whether invoices match agreed terms. Focus on pricing, price-change rules, payment terms, delivery and penalty clauses.",fmt:"A table: Term, What the contract says, Clause number. Then a list of anything unusual or risky.",chk:"Quote clause numbers. If a term isn't in the document, write 'Not stated'. Don't give legal advice."},
    blank:{role:"",task:"",ctx:"",fmt:"",chk:""}
  };
  const f={role:$("#pbRole"),task:$("#pbTask"),ctx:$("#pbCtx"),fmt:$("#pbFmt"),chk:$("#pbChk")};
  const out=$("#pbOut");let plain="";
  function render(){
    const parts=[["role","",f.role.value],["task","",f.task.value],["ctx","Context: ",f.ctx.value],["fmt","Format: ",f.fmt.value],["chk","Rules: ",f.chk.value]];
    const filled=parts.filter(p=>p[2].trim());
    plain=filled.map(p=>p[1]+p[2].trim()).join("\n\n");
    out.innerHTML=filled.length?filled.map(p=>(p[1]?`<span class="k">${p[1]}</span>`:"")+esc(p[2].trim())).join("\n\n"):'<span style="color:var(--ink-3)">Start typing in the fields to build your prompt.</span>';
    const n=filled.length;$$("#pbSegs i").forEach((s,i)=>s.classList.toggle("on",i<n));
    $("#pbStr").textContent=["Nothing filled in yet","1 of 5 parts filled in","2 of 5 parts filled in","3 of 5 parts filled in","4 of 5 parts filled in","All 5 parts filled in"][n];

    $("#tsNote").innerHTML=`<b>How to use this number:</b> about ${Math.round(m*12)} hours a year is time you can redirect into deeper investigation, supplier follow-up and process fixes, which is where an auditor adds the most value. Measure your actual times before and after for three months; real data beats estimates.`;}
  box.addEventListener("input",calc);calc();
})();

/* ---------------- glossary ---------------- */
const GL=[
  ["ABC classification","Ranking items by annual value (or velocity or risk) so the most important ones get counted and checked most often.","M6"],
  ["Agent (AI agent)","AI that works toward a goal by planning steps, using tools and checking results, rather than just answering one question.","M10"],
  ["Agent Mode","A Copilot feature in Excel that builds and edits workbooks through multi-step, plain-English requests.","M2"],
  ["Anomaly detection","Machine learning that learns what normal looks like and flags things that deviate from it.","M11"],
  ["Anonymise","Replace sensitive details (names, prices, IDs) with codes or scaled values before sharing data.","M3"],
  ["Audit trail","A record of who did what, when and to which data. Essential for any automation.","M10"],
  ["Benford's law","The pattern that leading digits follow in many natural datasets. Used as a screening test for unusual financial data.","M8"],
  ["Context window","How much text an AI model can consider at once, including your prompt, files and its answer.","M2"],
  ["Copilot","Microsoft's AI assistant, available as a chat app and inside Excel, Word, Outlook and Teams.","M2"],
  ["=COPILOT() function","An Excel function that runs a plain-English prompt on cell data. Good for text; not for calculations needing accuracy.","M7"],
  ["Custom instructions","Standing information you save in an AI assistant so every chat starts knowing your role and preferences.","M4"],
  ["Cycle count","Counting a subset of inventory on a rolling schedule instead of a full stock-take.","M6"],
  ["Data dictionary","A short description of each column in a dataset: what it means, its units and format.","M5"],
  ["Deep learning","Machine learning using large neural networks. Powers image recognition, speech and modern language models.","M1"],
  ["Document AI / OCR","AI that reads scanned or PDF documents, such as invoices, and extracts structured data.","M11"],
  ["Few-shot prompting","Including a few examples of the answer you want in your prompt so the AI copies the pattern.","M5"],
  ["Generative AI","AI that creates new content: text, tables, code or images.","M1"],
  ["GRN (goods receipt note)","The record that goods have been received at the warehouse.","M6"],
  ["Gross variance","The sum of absolute variances, so overages and shortages don't cancel out.","M6"],
  ["Hallucination","When AI produces confident but false or made-up information.","M3"],
  ["Inventory record accuracy (IRA)","Share of counted lines where the system quantity matches the physical count within tolerance.","M6"],
  ["Large language model (LLM)","The type of AI behind chat assistants: trained on huge amounts of text to predict and generate language.","M1"],
  ["Machine learning (ML)","AI that learns patterns from data rather than following hand-written rules.","M1"],
  ["Maverick spend","Buying outside approved suppliers, contracts or processes.","M6"],
  ["Near-duplicate","Two records that are the same in reality but differ slightly in the data, such as an invoice number with a suffix.","M8"],
  ["Power Automate","Microsoft's tool for building automated workflows that run on a schedule or trigger.","M10"],
  ["Power Query","Excel's built-in tool for importing, combining and cleaning data with repeatable steps.","M7"],
  ["Precision","Of everything a tool flagged, the share that was really a problem.","M11"],
  ["Predictive AI","AI that learns from historical data to forecast or score, such as demand forecasts or risk scores.","M1"],
  ["Prompt","The instruction you give an AI tool.","M4"],
  ["RAG (retrieval-augmented generation)","AI that searches your documents first and answers from them, citing sources.","M11"],
  ["Recall","Of all the real problems, the share a tool caught.","M11"],
  ["Shrink","Inventory lost to theft, damage or error, usually measured as a share of inventory value.","M6"],
  ["Split purchase order","Breaking one purchase into several smaller POs to stay under an approval limit.","M6"],
  ["Temperature","A setting that controls how random or creative an AI's word choices are. Lower is more predictable.","M1"],
  ["Three-way match","Checking that PO, goods receipt and invoice agree before paying.","M6"],
  ["Tie out","Confirming a figure by tracing it back to an independent source, such as matching totals to Excel.","M3"],
  ["Token","A chunk of text (roughly three-quarters of a word) that AI models read and write. Usage is measured in tokens.","M1"],
  ["Unit of measure (UOM)","The unit a quantity is recorded in, such as each (EA) or case (CS). Mismatches are a common source of variances.","M6"],
  ["Vendor master","The list of approved suppliers and their details in the ERP.","M6"]
];
